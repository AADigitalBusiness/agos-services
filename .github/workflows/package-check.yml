name: Django package checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build
      - name: Django system check
        run: python manage.py check
      - name: Verify migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python -m pytest
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify wheel contains models and migrations
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = set(z.namelist())
          for name in (
              "agos_services/asgi.py",
              "agos_services/urls.py",
              "agos_services/apps/channels/models.py",
              "agos_services/apps/channels/migrations/0001_initial.py",
              "agos_services/apps/auth/migrations/0001_initial.py",
              "agos_services/apps/channels/migrations/0002_namespaced_shopify_tools.py",
              "agos_services/apps/mcp_server/docs/01-overview.md",
              "agos_services/apps/mcp_server/docs/07-decisions/0001-service-namespaces.md",
              "agos_services/apps/channels/docs/01-overview.md",
          ):
              assert name in names, f"Missing in wheel: {name}"
          PY

      - name: Verify installation in independent Django host
        run: |
          python -m venv "$RUNNER_TEMP/agos-host"
          "$RUNNER_TEMP/agos-host/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/agos-host/bin/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/host-app"
          cat > "$RUNNER_TEMP/host-app/test_host.py" <<'PY'
          import os
          import sys
          import tempfile
          from pathlib import Path

          from django.conf import settings

          assert not any(Path(part).resolve() == Path(os.getcwd()).resolve() for part in sys.path if part)
          settings.configure(
              SECRET_KEY="host-smoke-test-only",
              DEBUG=False,
              ALLOWED_HOSTS=["localhost"],
              INSTALLED_APPS=[
                  "django.contrib.auth",
                  "django.contrib.contenttypes",
                  "agos_services.apps.channels.apps.ChannelsConfig",
                  "agos_services.apps.mcp_server.apps.McpServerConfig",
              ],
              DATABASES={"default": {"ENGINE": "django.db.backends.sqlite3", "NAME": ":memory:"}},
              MIDDLEWARE=[],
              ROOT_URLCONF="host_urls",
              MCP_AUTH_REQUIRED=True,
              AGOS_ENABLE_SHOPIFY_TOOLS=False,
              AGOS_ENABLE_SERVICE_DISCOVERY=False,
          )
          import django
          django.setup()
          from django.core.management import call_command
          from django.core.asgi import get_asgi_application
          from agos_services.asgi import mount_mcp
          from agos_services.apps.channels.models import MCPClient, ToolPermission

          call_command("check", verbosity=0)
          call_command("migrate", verbosity=0)
          client = MCPClient.objects.create(name="host smoke client")
          assert client.has_permission_for_tool("example.health.ping") is False
          ToolPermission.objects.create(
              client=client, tool_name="example.health.ping", allowed=True
          )
          assert client.has_permission_for_tool("example.health.ping")
          assert mount_mcp(get_asgi_application()) is not None
          print("Independent host installation, migration, and ASGI mount passed")
          PY
          cat > "$RUNNER_TEMP/host-app/host_urls.py" <<'PY'
          urlpatterns = []
          PY
          ( cd "$RUNNER_TEMP/host-app" && "$RUNNER_TEMP/agos-host/bin/python" test_host.py )
