[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-agos-services"
version = "0.1.0"
description = "Governed Model Context Protocol (MCP) gateway for Shopify e-commerce operations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AA Digital Business Team", email = "engineering@aadigitalbusiness.com" }
]
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "django-oauth-toolkit>=2.3.0",
    "django-cors-headers>=4.3.0",
    "mcp>=2.0.0",
    "starlette>=0.37.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra -q --asyncio-mode=auto"

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-django>=4.8.0", "pytest-asyncio>=0.23.0", "respx>=0.21.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "agos_services*"]
namespaces = true
